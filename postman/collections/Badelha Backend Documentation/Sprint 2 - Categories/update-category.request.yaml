$kind: http-request
name: update category
order: 4000
description: |-
  ### Update Category

  **Endpoint:** `PUT /api/categories/:id`

  **Access:** 🔐 Admin only — requires authentication with Admin role

  ---

  ### Path Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `id` | integer | ✅ | Category ID |

  ---

  ### Request Body (JSON) — all fields optional

  | Field | Type | Rules |
  | --- | --- | --- |
  | `name` | string | 2–100 characters |
  | `description` | string | Max 500 characters |
  | `icon` | string | Emoji or icon identifier |
  | `displayOrder` | integer | Non-negative integer |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Category updated successfully",
    "data": { "category_id": 5, "category_name": "Electronics - Updated", ... }
  }
  ```

  ---

  ### Error Responses

  | Status | Message | Cause |
  | --- | --- | --- |
  | `400 Bad Request` | Validation error | Invalid field values |
  | `401 Unauthorized` | Unauthorized | Missing or invalid token |
  | `403 Forbidden` | Forbidden | Not an Admin |
  | `404 Not Found` | Category not found | No category with given ID |
url: '{{baseUrl}}/api/categories/{{categoryId}}'
method: PUT
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
pathVariables:
  - key: categoryId
    value: '{{categoryId}}'
    description: Category ID (set by Create Category)
body:
  type: json
  content: |-
    {
      "name": "Electronics - Updated",
      "description": "Updated description for electronic devices",
      "icon": "💻",
      "displayOrder": 3
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success flag true", function () {
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response message is correct", function () {
          pm.expect(json.message).to.eql("Category updated successfully");
      });
