$kind: http-request
name: create product
description: |-
  ### Create Product

  **Endpoint**

  `POST /api/products`

  **Description**

  Creates a new product listing for the authenticated user.
  The user must be logged in and provide a valid Bearer token.
  Images are uploaded as multipart/form-data (max 5 files).

  > 🔐 Requires authentication — include `Authorization: Bearer {{accessToken}}`

  ---

  ### Request Body (multipart/form-data)

  | Field | Type | Required | Rules |
  | --- | --- | --- | --- |
  | `title` | string | ✅ Yes | 5–200 characters |
  | `description` | string | ✅ Yes | Minimum 10 characters |
  | `categoryId` | integer | ✅ Yes | Positive integer |
  | `cityId` | integer | ✅ Yes | Positive integer |
  | `condition` | string | ✅ Yes | `NEW`, `LIKE_NEW`, `GOOD`, `FAIR`, or `POOR` |
  | `price` | number | ❌ Optional | Positive number |
  | `exchangePreference` | string | ❌ Optional | `EXCHANGE_ONLY`, `PURCHASE_ONLY`, or `BOTH` |
  | `tags` | array of integers | ❌ Optional | Array of positive tag IDs |
  | `additionalInfo` | string | ❌ Optional | Max 500 characters |
  | `images` | file(s) | ❌ Optional | Up to 5 image files |

  ---

  ### Example Request Body

  ```
  title        = Vintage Leather Jacket
  description  = Genuine leather jacket in great condition, barely worn
  categoryId   = 1
  cityId       = 1
  condition    = LIKE_NEW
  price        = 150
  exchangePreference = BOTH
  additionalInfo = Open to exchange for similar items
  ```

  ---

  ### Success Response — `201 Created`

  ```json
  {
    "success": true,
    "statusCode": 201,
    "message": "Product created successfully",
    "data": {
      "product_id": 42,
      "title": "Vintage Leather Jacket",
      "description": "Genuine leather jacket in great condition, barely worn",
      "condition": "LIKE_NEW",
      "price": 150,
      "exchange_preference": "BOTH",
      "additional_info": "Open to exchange for similar items",
      "status": "ACTIVE",
      "is_featured": false,
      "created_at": "2024-01-01T00:00:00.000Z",
      "category": { "category_id": 1, "category_name": "Clothing" },
      "city": { "city_id": 1, "city_name": "Gaza" },
      "images": [],
      "tags": []
    }
  }
  ```

  ---

  ### Error Responses

  | Status | Message | Cause |
  | --- | --- | --- |
  | `400 Bad Request` | Validation error | Missing or invalid required fields |
  | `401 Unauthorized` | Unauthorized | Missing or invalid access token |
  | `404 Not Found` | Category not found | Provided `categoryId` does not exist |
  | `404 Not Found` | City not found | Provided `cityId` does not exist |
url: '{{baseUrl}}/api/products'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: formdata
  content:
    - key: title
      type: text
      value: Vintage Leather Jacket
      description: 'Product title (5–200 characters)'
    - key: description
      type: text
      value: Genuine leather jacket in great condition, barely worn
      description: Product description (minimum 10 characters)
    - key: categoryId
      type: text
      value: '1'
      description: Category ID (positive integer)
    - key: cityId
      type: text
      value: '1'
      description: City ID (positive integer)
    - key: condition
      type: text
      value: LIKE_NEW
      description: 'Condition: NEW, LIKE_NEW, GOOD, FAIR, or POOR'
    - key: price
      type: text
      value: '150'
      description: Price (optional, positive number)
    - key: exchangePreference
      type: text
      value: BOTH
      description: 'Exchange preference: EXCHANGE_ONLY, PURCHASE_ONLY, or BOTH'
    - key: additionalInfo
      type: text
      value: Open to exchange for similar items
      description: Additional info (optional, max 500 characters)
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has success flag set to true", function () {
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response contains data object", function () {
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("object");
      });

      pm.test("Product has required fields", function () {
          const product = json.data;
          pm.expect(product).to.have.property("product_id");
          pm.expect(product).to.have.property("title");
          pm.expect(product).to.have.property("description");
          pm.expect(product).to.have.property("condition");
          pm.expect(product).to.have.property("status");
      });

      pm.test("Product title matches submitted value", function () {
          pm.expect(json.data.title).to.eql("Vintage Leather Jacket");
      });

      pm.test("Product condition is valid", function () {
          const validConditions = ["NEW", "LIKE_NEW", "GOOD", "FAIR", "POOR"];
          pm.expect(validConditions).to.include(json.data.condition);
      });

      pm.test("Product status is ACTIVE", function () {
          pm.expect(json.data.status).to.eql("ACTIVE");
      });

      pm.test("Response message is correct", function () {
          pm.expect(json.message).to.eql("Product created successfully");
      });

      if (pm.response.code === 201 && json.data?.product_id) {
          pm.environment.set("productId", json.data.product_id);
          console.log("✅ productId saved to environment:", json.data.product_id);
      }
order: 1000
