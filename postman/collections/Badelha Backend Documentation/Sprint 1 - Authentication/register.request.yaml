$kind: http-request
description: |-
  # **Register User**

  ## Endpoint

  HTTP POST /api/auth/registerShow more lines

  ## Purpose

  Create a new user account in the Badelha platform.

  Upon successful registration:

  - User record is created.
      
  - Password is hashed using bcrypt.
      
  - Account status is set to `PENDING_VERIFICATION`.
      
  - JWT Access Token is generated.
      
  - JWT Refresh Token is generated.
      
  - Verification email is prepared for the user.
      

  ---

  ## Authentication

  Plain Text1No authentication required.Show more lines

  ---

  ## Headers

  | Header | Value |
  | --- | --- |
  | Content-Type | application/json |

  ---

  ## Request Body

  JSON1{2 "fullName": "Dina Jendeya",3 "phoneNumber": "0595723456",4 "address": "Gazahero",5 "email": "dina1@test.com",6 "password": "Password123!",7 "cityId": 18}Show more lines

  ### Request Fields

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | fullName | string | Yes | User full name |
  | phoneNumber | string | Yes | Palestinian phone number |
  | address | string | Yes | User address |
  | email | string | Yes | User email |
  | password | string | Yes | User password |
  | cityId | integer | Yes | Existing city identifier |

  ---

  ## Validation Rules

  ### fullName

  Plain Text1Required23–100 characters3Letters and spaces onlyShow more lines

  ### phoneNumber

  Plain Text1Required2Format: 05XXXXXXXX3Exactly 10 digitsShow more lines

  ### address

  Plain Text1Required25–255 charactersShow more lines

  ### email

  Plain Text1Required2Must be a valid email addressShow more lines

  ### password

  Plain Text1Required2Minimum 8 characters3One uppercase letter4One lowercase letter5One number6One special characterShow more lines

  ### cityId

  Plain Text1Required2Positive integer3Must exist in cities tableShow more lines

  ---

  ## Business Logic

  The registration process performs the following steps:

  Validate request body

  ↓

  Check for existing email

  ↓

  Check for existing phone number

  ↓

  Hash password using bcrypt

  ↓

  Create user record

  ↓

  Assign default USER role

  ↓

  Generate verification token

  ↓

  Generate JWT tokens

  ↓

  Return response

  ---

  ## Success Response

  ### Status

  HTTP1201 CreatedShow more lines

  ### Response Body

  JSON{

  "success": true,

  "statusCode": 201,

  "message": "User registered successfully",

  "data": {

  "user": {

  "user_id": 1,

  "full_name": "Dina Jendeya",

  "email": "dina1@test.com",

  "phone_number": "0595723456",

  "city_id": 112 },

  "accessToken": "",

  "refreshToken": ""15 }

  }

  ---

  ## Error Responses

  ### Validation Error

  HTTP

  400 Bad Request

  JSON

  {

  "success": false,

  "message": "Validation error"

  }

  ---

  ### Email Already Exists

  HTTP

  409 Conflict

  JSON

  {

  "success": false,

  "message": "Email already exists"

  }

  ---

  ### Phone Number Already Exists

  HTTP Conflict

  JSON1{

  "success": false,

  "message": "Phone number already exists"

  ---

  ### Internal Server Error

  HTTP 500 Internal Server ErrorEndFragment
