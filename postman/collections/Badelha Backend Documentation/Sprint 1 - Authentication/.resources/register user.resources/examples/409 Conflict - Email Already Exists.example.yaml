$kind: http-example
name: '409 Conflict - Email Already Exists'
request:
  url: '{{baseUrl}}/api/auth/register'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "John Doe",
        "email": "existing@example.com",
        "password": "Secret@123",
        "phoneNumber": "0599123456",
        "address": "Ramallah, Palestine",
        "cityId": 1
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "statusCode": 409,
        "message": "Email already exists"
      }
order: 3000
