$kind: http-example
name: '201 Created - Success'
request:
  url: '{{baseUrl}}/api/auth/register'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "John Doe",
        "email": "john@example.com",
        "password": "Secret@123",
        "phoneNumber": "0599123456",
        "address": "Ramallah, Palestine",
        "cityId": 1
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "statusCode": 201,
        "message": "User registered successfully",
        "data": {
          "user": {
            "user_id": 1,
            "full_name": "John Doe",
            "email": "john@example.com",
            "phone_number": "0599123456",
            "address": "Ramallah, Palestine",
            "city_id": 1,
            "account_status": "PENDING_VERIFICATION",
            "is_verified": false,
            "created_at": "2024-01-01T00:00:00.000Z",
            "city": {
              "city_id": 1,
              "city_name": "Nablus"
            }
          },
          "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJpYXQiOjE3MDQwNjcyMDB9.example",
          "refreshToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJpYXQiOjE3MDQwNjcyMDB9.refresh"
        }
      }
order: 1000
