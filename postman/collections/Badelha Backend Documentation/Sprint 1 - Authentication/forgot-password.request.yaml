$kind: http-request
name: forgot password
description: |-
  ### Forgot Password

  **Endpoint**

  POST /api/auth/forgot-password

  **Description**

  Initiates the password reset flow for a registered user. Sends a password reset email containing a one-time token to the provided email address.

  Any previously unused reset tokens for the user are invalidated before a new one is created. The new token expires after **1 hour**.

  > ℹ️ For security reasons, if the email is not found in the system, a `404` error is returned. In production, consider returning a generic success message regardless to avoid user enumeration.

  ---

  ### Request Body

  ```json
  {
    "email": "john@example.com"
  }
  ```

  ---

  ### Validation Rules

  | Field | Rules |
  |---|---|
  | `email` | Required · Valid email format |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Password reset email sent",
    "data": {
      "message": "Password reset email sent"
    }
  }
  ```

  > 📧 A password reset email is sent to the provided address with a link containing the reset token. Use that token in the `/api/auth/reset-password` endpoint.

  ---

  ### Error Responses

  | Status | Message | Cause |
  |---|---|---|
  | `400 Bad Request` | Validation error | Missing or invalid email |
  | `404 Not Found` | User not found | No account exists with the given email |
url: '{{baseUrl}}/api/auth/forgot-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success flag set to true", function () {
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response contains data object", function () {
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("object");
      });

      pm.test("Response data contains message field", function () {
          pm.expect(json.data).to.have.property("message");
          pm.expect(json.data.message).to.be.a("string").and.not.empty;
      });

      if (pm.response.code === 200) {
          // Fetch the password reset token from the dev endpoint
          const email = pm.environment.get("testEmail");
          const baseUrl = pm.environment.get("baseUrl");
          pm.sendRequest(
              `${baseUrl}/api/auth/dev/password-reset-token?email=${encodeURIComponent(email)}`,
              function (err, res) {
                  if (!err && res.code === 200) {
                      const token = res.json().token;
                      pm.environment.set("passwordResetToken", token);
                      console.log("✅ passwordResetToken saved to environment.");
                  } else {
                      console.warn("⚠️ Could not fetch passwordResetToken:", err || res.text());
                  }
              }
          );
      }
