$kind: http-request
description: |-
  ### Get All Products

  **Endpoint:** `GET /api/products`

  **Access:** 🌐 Public — no authentication required

  ---

  ### Query Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `page` | integer | ❌ | Page number (default: 1) |
  | `limit` | integer | ❌ | Items per page (default: 20, max: 100) |
  | `categoryId` | integer | ❌ | Filter by category ID |
  | `cityId` | integer | ❌ | Filter by city ID |
  | `condition` | string | ❌ | `NEW`, `LIKE_NEW`, `GOOD`, `FAIR`, or `POOR` |
  | `minPrice` | number | ❌ | Minimum price filter |
  | `maxPrice` | number | ❌ | Maximum price filter |
  | `search` | string | ❌ | Search by title or description |
  | `sort` | string | ❌ | `newest`, `price`, `price_desc`, or `rating` |
  | `tagId` | integer | ❌ | Filter by tag ID |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Products retrieved successfully",
    "data": {
      "products": [...],
      "pagination": {
        "page": 1,
        "limit": 20,
        "total": 100,
        "totalPages": 5
      }
    }
  }
  ```
url: "{{baseUrl}}/api/products?page=1&limit=20"
method: GET
queryParams:
  - key: page
    value: "1"
    description: Page number
  - key: limit
    value: "20"
    description: Items per page (max 100)
  - key: sort
    value: newest
    disabled: true
    description: "Sort order: newest, price, price_desc, rating"
  - key: condition
    value: LIKE_NEW
    disabled: true
    description: "Filter by condition: NEW, LIKE_NEW, GOOD, FAIR, POOR"
  - key: categoryId
    value: "1"
    disabled: true
    description: Filter by category ID
  - key: cityId
    value: "1"
    disabled: true
    description: Filter by city ID
  - key: minPrice
    value: "0"
    disabled: true
    description: Minimum price filter
  - key: maxPrice
    value: "500"
    disabled: true
    description: Maximum price filter
  - key: search
    value: jacket
    disabled: true
    description: Search by title or description
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success flag true", function () {
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response contains data object", function () {
          pm.expect(json).to.have.property("data");
      });
    language: text/javascript
order: 1000
