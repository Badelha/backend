$kind: http-request
description: |-
  ### Unfeature a Product

  **Endpoint:** `PATCH /api/products/:id/unfeature`

  **Access:** 🔐 Admin only — requires authentication with Admin role

  > Removes the featured status from a product.

  ---

  ### Path Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `id` | integer | ✅ | Product ID |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Product unfeatured successfully",
    "data": { "product_id": 1, "is_featured": false }
  }
  ```

  ---

  ### Error Responses

  | Status | Message | Cause |
  | --- | --- | --- |
  | `401 Unauthorized` | Unauthorized | Missing or invalid token |
  | `403 Forbidden` | Forbidden | Authenticated user is not an Admin |
  | `404 Not Found` | Product not found | No product with given ID |
url: "{{baseUrl}}/api/products/{{productId}}/unfeature"
method: PATCH
pathVariables:
  - key: productId
    value: "{{productId}}"
    description: Product ID
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success flag true", function () {
          pm.expect(json.success).to.be.true;
      });
    language: text/javascript
order: 16000
