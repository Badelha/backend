$kind: http-request
description: |-
  ### Complete Purchase Request

  **Endpoint:** `PATCH /api/purchases/:id/complete`

  **Access:** 🔐 Authenticated — requires a valid Bearer token

  Marks an accepted purchase request as completed. Transitions the request status from `ACCEPTED` to `COMPLETED`.

  > 💡 `{{purchaseId}}` is automatically captured after running **Create Purchase** or **Get All Purchases**.

  ---

  ### Path Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `id` | integer | ✅ | Purchase request ID (positive integer) |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Purchase completed successfully",
    "data": {
      "purchase_request_id": 1,
      "request_status": "COMPLETED"
    },
    "timestamp": "2024-01-01T00:00:00.000Z"
  }
  ```

  ---

  ### Error Responses

  | Status | Cause |
  | --- | --- |
  | `401 Unauthorized` | Missing or invalid Bearer token |
  | `404 Not Found` | Purchase request not found |
url: '{{baseUrl}}/api/purchases/{{purchaseId}}/complete'
method: PATCH
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{purchaseId}}'
    description: 'Purchase request ID (auto-set by Create/Get All Purchases)'
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response envelope is valid", function () {
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("statusCode", 200);
          pm.expect(json).to.have.property("message", "Purchase completed successfully");
          pm.expect(json).to.have.property("data");
      });

      pm.test("Purchase status is COMPLETED", function () {
          pm.expect(json.data).to.have.property("request_status", "COMPLETED");
      });
    language: text/javascript
order: 5000
