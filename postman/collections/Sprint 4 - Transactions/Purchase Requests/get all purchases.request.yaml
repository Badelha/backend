$kind: http-request
description: |-
  ### Get All Purchases

  **Endpoint:** `GET /api/purchases`

  **Access:** 🔐 Authenticated — requires a valid Bearer token

  Returns a paginated list of purchase requests where the authenticated user is either the initiator (buyer) or the target (seller). Supports optional filtering by status.

  ---

  ### Query Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `page` | integer | ❌ | Page number (default: 1, min: 1) |
  | `limit` | integer | ❌ | Items per page (default: 20, max: 100) |
  | `status` | string | ❌ | Filter by status: `PENDING`, `ACCEPTED`, `REJECTED`, `COMPLETED`, `CANCELLED` |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Purchase requests retrieved successfully",
    "data": {
      "requests": [
        {
          "purchase_request_id": 1,
          "initiator_user_id": 2,
          "target_user_id": 3,
          "product_id": 5,
          "offered_price": 150.00,
          "buyer_message": "I'd like to buy this",
          "request_status": "PENDING",
          "requested_at": "2024-01-01T00:00:00.000Z"
        }
      ],
      "total": 1,
      "page": 1,
      "limit": 20
    },
    "timestamp": "2024-01-01T00:00:00.000Z"
  }
  ```

  ---

  ### Error Responses

  | Status | Cause |
  | --- | --- |
  | `401 Unauthorized` | Missing or invalid Bearer token |
url: '{{baseUrl}}/api/purchases?page={{page}}&limit={{limit}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: page
    value: '{{page}}'
    description: 'Page number (default: 1, min: 1)'
  - key: limit
    value: '{{limit}}'
    description: 'Items per page (default: 20, max: 100)'
  - key: status
    value: ''
    description: 'Optional filter: PENDING | ACCEPTED | REJECTED | COMPLETED | CANCELLED'
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response envelope is valid", function () {
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("statusCode", 200);
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("data");
      });

      pm.test("Data contains requests array and pagination", function () {
          pm.expect(json.data).to.have.property("requests").that.is.an("array");
          pm.expect(json.data).to.have.property("total");
          pm.expect(json.data).to.have.property("page");
          pm.expect(json.data).to.have.property("limit");
      });

      // Auto-capture the first purchase ID for downstream requests
      if (json.data && Array.isArray(json.data.requests) && json.data.requests.length > 0) {
          const firstId = json.data.requests[0].purchase_request_id;
          pm.collectionVariables.set("purchaseId", String(firstId));
          pm.environment.set("purchaseId", String(firstId));
          console.log("purchaseId captured:", firstId);
      }
    language: text/javascript
order: 1000
