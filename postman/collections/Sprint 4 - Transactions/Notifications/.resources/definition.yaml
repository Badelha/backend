$kind: collection
name: 'Notifications'
description: |-
  ## Notifications

  Endpoints for managing in-app notifications for the authenticated user.

  | Endpoint | Description |
  | --- | --- |
  | `GET /api/notifications` | List all notifications (paginated) |
  | `GET /api/notifications/unread-count` | Get the count of unread notifications |
  | `PATCH /api/notifications/read-all` | Mark all notifications as read (bulk) |
  | `PATCH /api/notifications/:id/read` | Mark a single notification as read |
  | `DELETE /api/notifications/:id` | Delete a single notification |
order: 3000
