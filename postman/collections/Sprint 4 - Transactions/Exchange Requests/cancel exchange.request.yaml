$kind: http-request
description: |-
  ### Cancel Exchange Request

  **Endpoint:** `PATCH /api/exchanges/:id/cancel`

  **Access:** 🔐 Authenticated — requires a valid Bearer token

  Cancels an exchange request. The initiator can cancel a `PENDING` request. Transitions the request status to `CANCELLED`.

  > 💡 `{{exchangeId}}` is automatically captured after running **Create Exchange** or **Get All Exchanges**.

  ---

  ### Path Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `id` | integer | ✅ | Exchange request ID (positive integer) |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Exchange cancelled successfully",
    "data": {
      "exchange_request_id": 1,
      "request_status": "CANCELLED"
    },
    "timestamp": "2024-01-01T00:00:00.000Z"
  }
  ```

  ---

  ### Error Responses

  | Status | Cause |
  | --- | --- |
  | `401 Unauthorized` | Missing or invalid Bearer token |
  | `404 Not Found` | Exchange request not found |
url: '{{baseUrl}}/api/exchanges/{{exchangeId}}/cancel'
method: PATCH
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{exchangeId}}'
    description: 'Exchange request ID (auto-set by Create/Get All Exchanges)'
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response envelope is valid", function () {
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("statusCode", 200);
          pm.expect(json).to.have.property("message", "Exchange cancelled successfully");
          pm.expect(json).to.have.property("data");
      });

      pm.test("Exchange status is CANCELLED", function () {
          pm.expect(json.data).to.have.property("request_status", "CANCELLED");
      });
    language: text/javascript
order: 6000
