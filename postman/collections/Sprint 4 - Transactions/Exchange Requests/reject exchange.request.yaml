$kind: http-request
description: |-
  ### Reject Exchange Request

  **Endpoint:** `PATCH /api/exchanges/:id/reject`

  **Access:** 🔐 Authenticated — requires a valid Bearer token

  Rejects a pending exchange request. Only the target user can reject. Transitions the request status from `PENDING` to `REJECTED`. An optional rejection reason can be provided.

  > 💡 `{{exchangeId}}` is automatically captured after running **Create Exchange** or **Get All Exchanges**.

  ---

  ### Path Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `id` | integer | ✅ | Exchange request ID (positive integer) |

  ### Request Body

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `reason` | string | ❌ | Rejection reason (max 500 chars) |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Exchange request rejected successfully",
    "data": {
      "exchange_request_id": 1,
      "request_status": "REJECTED"
    },
    "timestamp": "2024-01-01T00:00:00.000Z"
  }
  ```

  ---

  ### Error Responses

  | Status | Cause |
  | --- | --- |
  | `401 Unauthorized` | Missing or invalid Bearer token |
  | `404 Not Found` | Exchange request not found |
url: '{{baseUrl}}/api/exchanges/{{exchangeId}}/reject'
method: PATCH
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{exchangeId}}'
    description: 'Exchange request ID (auto-set by Create/Get All Exchanges)'
body:
  type: json
  content: |-
    {
      "reason": "Not interested in this exchange"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response envelope is valid", function () {
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("statusCode", 200);
          pm.expect(json).to.have.property("message", "Exchange request rejected successfully");
          pm.expect(json).to.have.property("data");
      });

      pm.test("Exchange status is REJECTED", function () {
          pm.expect(json.data).to.have.property("request_status", "REJECTED");
      });
    language: text/javascript
order: 4000
