$kind: http-request
description: |-
  ### Get Exchange by ID

  **Endpoint:** `GET /api/exchanges/:id`

  **Access:** 🔐 Authenticated — requires a valid Bearer token

  Returns a single exchange request by its numeric ID. The authenticated user must be either the initiator or the target of the request.

  > 💡 `{{exchangeId}}` is automatically captured after running **Get All Exchanges**.

  ---

  ### Path Parameters

  | Parameter | Type | Required | Description |
  | --- | --- | --- | --- |
  | `id` | integer | ✅ | Exchange request ID (positive integer) |

  ---

  ### Success Response — `200 OK`

  ```json
  {
    "success": true,
    "statusCode": 200,
    "message": "Exchange request retrieved successfully",
    "data": {
      "exchange_request_id": 1,
      "initiator_user_id": 2,
      "target_user_id": 3,
      "initiator_product_id": 4,
      "target_product_id": 5,
      "request_status": "PENDING",
      "requested_at": "2024-01-01T00:00:00.000Z"
    },
    "timestamp": "2024-01-01T00:00:00.000Z"
  }
  ```

  ---

  ### Error Responses

  | Status | Cause |
  | --- | --- |
  | `401 Unauthorized` | Missing or invalid Bearer token |
  | `404 Not Found` | No exchange request with the given ID |
url: '{{baseUrl}}/api/exchanges/{{exchangeId}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{exchangeId}}'
    description: 'Exchange request ID (auto-set by Get All Exchanges)'
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response envelope is valid", function () {
          pm.expect(json).to.have.property("success", true);
          pm.expect(json).to.have.property("statusCode", 200);
          pm.expect(json).to.have.property("data");
      });

      pm.test("Exchange has required fields", function () {
          pm.expect(json.data).to.have.property("exchange_request_id");
          pm.expect(json.data).to.have.property("request_status");
          pm.expect(json.data).to.have.property("initiator_product_id");
          pm.expect(json.data).to.have.property("target_product_id");
      });

      pm.test("Returned ID matches requested ID", function () {
          const requestedId = pm.collectionVariables.get("exchangeId");
          pm.expect(String(json.data.exchange_request_id)).to.equal(String(requestedId));
      });
    language: text/javascript
order: 2000
