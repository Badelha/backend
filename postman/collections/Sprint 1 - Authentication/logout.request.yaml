$kind: http-request
url: "{{baseUrl}}/api/auth/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success flag set to true", function () {
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response message is Logout successful", function () {
          pm.expect(json.message).to.eql("Logout successful");
      });

      pm.test("Response data is null", function () {
          pm.expect(json.data).to.be.null;
      });

      if (pm.response.code === 200) {
          pm.environment.unset("accessToken");
          console.log("✅ accessToken cleared from environment after logout.");
      }
    language: text/javascript
order: 8000
