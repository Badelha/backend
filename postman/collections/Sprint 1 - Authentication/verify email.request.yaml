$kind: http-request
url: "{{baseUrl}}/api/auth/verify-email?token={{emailVerificationToken}}"
method: GET
queryParams:
  token: "{{emailVerificationToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Fetch the latest unused email verification token for the registered test user
      // from the backend DB via a helper endpoint, or use the token saved by register.
      // If your backend exposes a dev/test endpoint to retrieve the token, call it here.
      // Otherwise, the token must be set manually or via a DB query script before the run.
      const token = pm.environment.get('emailVerificationToken');
      if (!token) {
          console.warn('⚠️ emailVerificationToken is not set. Please set it from the DB or email before running.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has success flag set to true", function () {
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response contains data object", function () {
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("object");
      });

      pm.test("Response data contains message field", function () {
          pm.expect(json.data).to.have.property("message");
          pm.expect(json.data.message).to.eql("Email verified successfully");
      });
    language: text/javascript
order: 4000
