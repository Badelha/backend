name: Badelha CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: badelha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate Prisma client
        run: npm run build

      - name: Run automated tests
        run: npm test

      - name: Verify application entry point
        run: node --check server.js

  deployment-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Confirm successful pipeline
        run: echo "Badelha Backend is validated and ready for deployment."
